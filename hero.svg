<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-label="Apeksha Bagde, Data Analyst and Analytics Engineer. Turning raw data into decisions. 1+ year experience, Microsoft PL-300 certified, B.Tech Computer Science 2026, available immediately.">
<title>Apeksha Bagde, Data Analyst and Analytics Engineer. Turning raw data into decisions. 1+ year experience, Microsoft PL-300 certified, B.Tech Computer Science 2026, available immediately.</title>
<style>.t{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI Variable Display','Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif;}
    .o1{animation:d1 16s ease-in-out infinite alternate}
    .o2{animation:d2 19s ease-in-out infinite alternate}
    .o3{animation:d3 17s ease-in-out infinite alternate}
    @keyframes d1{to{transform:translate(120px,-30px)}}
    @keyframes d2{to{transform:translate(-140px,-40px)}}
    @keyframes d3{to{transform:translate(-90px,-20px)}}
    .f{opacity:0;animation:up 1.1s cubic-bezier(.2,.7,.2,1) forwards}
    .f1{animation-delay:.1s}.f2{animation-delay:.3s}.f3{animation-delay:.55s}.f4{animation-delay:.8s}
    @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.o1,.o2,.o3{animation:none}.f{animation:none;opacity:1}}
    </style>
<defs>
    <clipPath id="c"><rect width="1280" height="460" rx="34"/></clipPath>
    <filter id="b" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="64"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0c10"/><stop offset="1" stop-color="#000"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2997ff"/><stop offset=".5" stop-color="#bf5af2"/><stop offset="1" stop-color="#ff6482"/>
    </linearGradient>
    </defs>

<g clip-path="url(#c)">
  <rect width="1280" height="460" fill="url(#bg)"/>
  <g filter="url(#b)" opacity=".9">
    <ellipse class="o1" cx="230" cy="520" rx="330" ry="150" fill="#0a84ff"/>
    <ellipse class="o2" cx="690" cy="560" rx="360" ry="150" fill="#bf5af2"/>
    <ellipse class="o3" cx="1120" cy="510" rx="320" ry="150" fill="#ff375f"/>
    <ellipse class="o2" cx="940" cy="600" rx="240" ry="110" fill="#ff9f0a" opacity=".7"/>
  </g>
  <text class="t f f1" x="640" y="132" text-anchor="middle" font-size="21" font-weight="600" letter-spacing="5" fill="#a1a1a6">DATA ANALYST  ·  ANALYTICS ENGINEER</text>
  <text class="t f f2" x="640" y="246" text-anchor="middle" font-size="110" font-weight="700" letter-spacing="-3.5" fill="#f5f5f7">Apeksha Bagde</text>
  <text class="t f f3" x="640" y="312" text-anchor="middle" font-size="42" font-weight="600" letter-spacing="-.5" fill="url(#g)">Turning raw data into decisions.</text>
  <text class="t f f4" x="640" y="404" text-anchor="middle" font-size="20" font-weight="500" fill="#e5e5ea">1+ year experience   ·   Microsoft PL-300 certified   ·   B.Tech CS 2026   ·   Available immediately</text>
</g>
<rect x=".5" y=".5" width="1279" height="459" rx="34" fill="none" stroke="#ffffff" stroke-opacity=".12"/>

</svg>
