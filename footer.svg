<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Let's talk data. Open to Data Analyst and Analytics / Data Engineer roles. Nagpur, India. Available immediately.">
<title>Let's talk data. Open to Data Analyst and Analytics / Data Engineer roles. Nagpur, India. Available immediately.</title>
<style>.t{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI Variable Display','Segoe UI','Inter','Helvetica Neue',Helvetica,Arial,sans-serif;}
    .o1{animation:d1 15s ease-in-out infinite alternate}
    .o2{animation:d2 18s ease-in-out infinite alternate}
    @keyframes d1{to{transform:translate(120px,-20px)}}
    @keyframes d2{to{transform:translate(-120px,-26px)}}
    @media (prefers-reduced-motion:reduce){.o1,.o2{animation:none}}
    </style>
<defs>
    <clipPath id="c"><rect width="1280" height="300" rx="34"/></clipPath>
    <filter id="b" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0c10"/><stop offset="1" stop-color="#000"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2997ff"/><stop offset=".5" stop-color="#bf5af2"/><stop offset="1" stop-color="#ff6482"/></linearGradient>
    </defs>

<g clip-path="url(#c)">
  <rect width="1280" height="300" fill="url(#bg)"/>
  <g filter="url(#b)" opacity=".85">
    <ellipse class="o1" cx="300" cy="360" rx="330" ry="120" fill="#0a84ff"/>
    <ellipse class="o2" cx="880" cy="380" rx="360" ry="120" fill="#bf5af2"/>
    <ellipse class="o1" cx="1180" cy="350" rx="260" ry="110" fill="#ff375f"/>
  </g>
  <text class="t" x="640" y="132" text-anchor="middle" font-size="76" font-weight="700" letter-spacing="-2.5" fill="url(#g)">Let’s talk data.</text>
  <text class="t" x="640" y="190" text-anchor="middle" font-size="25" font-weight="500" fill="#e5e5ea">Open to Data Analyst and Analytics / Data Engineer roles.</text>
  <text class="t" x="640" y="232" text-anchor="middle" font-size="20" fill="#a1a1a6">Nagpur, India  ·  Available immediately</text>
</g>
<rect x=".5" y=".5" width="1279" height="299" rx="34" fill="none" stroke="#ffffff" stroke-opacity=".12"/>

</svg>
